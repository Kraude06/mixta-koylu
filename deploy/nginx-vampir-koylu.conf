# nginx ayarı — /etc/nginx/sites-available/vampir-koylu olarak kopyalayın.
# Sadece oyunun alt alan adını karşılar; sunucudaki diğer sitelere dokunmaz.
# oyun.ORNEK.com kısmını kendi alan adınızla, 3100'ü ecosystem.config.cjs'teki portla değiştirin.
# HTTPS'i certbot ekler: sudo certbot --nginx -d oyun.ORNEK.com

server {
    listen 80;
    server_name oyun.ORNEK.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket (Socket.io) için zorunlu
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzun süre açık kalan oyun bağlantıları kesilmesin
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
